apiVersion: apps/v1
kind: Deployment
metadata:
  name: courtslam-web
  namespace: courtslam-main
  labels:
    app: courtslam-web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: courtslam-web
  template:
    metadata:
      labels:
        app: courtslam-web
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: courtslam-web
                topologyKey: kubernetes.io/hostname
      imagePullSecrets:
        - name: registry-sternanchor
      containers:
        - name: web
          image: registry.digitalocean.com/sternanchor/courtslam-web:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
