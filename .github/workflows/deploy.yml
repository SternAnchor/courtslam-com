name: Build and Deploy to DigitalOcean K8s

on:
  push:
    branches:
      - main

env:
  DO_REGISTRY: registry.digitalocean.com/sternanchor
  GHCR_REGISTRY: ghcr.io/sternanchor
  IMAGE_NAME: courtslam-web

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DO Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.DO_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.DO_REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest .

      - name: Push to DO Container Registry
        run: |
          docker push ${{ env.DO_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.DO_REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Push to GitHub Container Registry
        run: |
          docker push ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Save kubeconfig
        run: doctl kubernetes cluster kubeconfig save sternanchor

      - name: Apply K8s manifests
        run: |
          kubectl apply -f k8s/base/namespace.yaml
          kubectl apply -f k8s/base/deployment.yaml
          kubectl apply -f k8s/base/service.yaml
          kubectl apply -f k8s/base/ingress.yaml

      - name: Update image and rollout
        run: |
          kubectl set image deployment/courtslam-web \
            web=${{ env.DO_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n courtslam-main
          kubectl rollout status deployment/courtslam-web -n courtslam-main --timeout=120s
